services:
  - type: web
    name: cubiertas-whatsapp
    runtime: node
    plan: starter
    rootDir: whatsapp-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bot-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_FILE
        value: /var/data/bot-state.json
      - key: QUOTES_ENABLED
        value: "false"
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: HUMAN_PHONE_NUMBER
        sync: false
